  #bar > div { width: 100%; height: 100%; background: linear-gradient(90deg, var(--green), var(--green-soft)); transform: scaleX(0); transform-origin: left center; transition: transform .18s linear; }
  #bar.hidden { visibility: hidden; }
  #message { font-size: 0.95rem; font-weight: 500; }
